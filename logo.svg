<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 280" role="img" aria-labelledby="title desc">
<title id="title">Silke's Reels</title>
<desc id="desc">Silke's Reels logo: elegant chrome-blue script lettering, gold crown, neon pink and blue rings, a gold-trimmed slot reel with three red sevens, and the tagline Play, Review, Win.</desc>
<defs>
 <linearGradient id="chrome" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#ffffff"/><stop offset=".18" stop-color="#9ceaff"/><stop offset=".42" stop-color="#168fe8"/><stop offset=".62" stop-color="#d9f7ff"/><stop offset=".82" stop-color="#1676cf"/><stop offset="1" stop-color="#071e58"/></linearGradient>
 <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#fff6b5"/><stop offset=".45" stop-color="#ffc52e"/><stop offset="1" stop-color="#a95708"/></linearGradient>
 <linearGradient id="reel" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#fffef0"/><stop offset=".5" stop-color="#f1e5c6"/><stop offset="1" stop-color="#c8b58e"/></linearGradient>
 <filter id="neonBlue" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
 <filter id="neonPink" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>
<ellipse cx="410" cy="132" rx="370" ry="104" fill="none" stroke="#ec25ef" stroke-width="5" opacity=".9" filter="url(#neonPink)"/>
