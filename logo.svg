<circle cx="112" cy="25" r="6" fill="#fff2a0"/><circle cx="178" cy="15" r="6" fill="#fff2a0"/><circle cx="146" cy="59" r="5" fill="#fff2a0"/>
<text x="410" y="132" text-anchor="middle" font-family="'Apple Chancery','Brush Script MT','Segoe Script',cursive" font-size="116" font-weight="bold" font-style="italic" fill="url(#chrome)" stroke="#061b50" stroke-width="4" paint-order="stroke" filter="url(#neonBlue)">Silke's</text>
<text x="410" y="211" text-anchor="middle" font-family="Impact,'Arial Black',sans-serif" font-size="86" font-weight="900" letter-spacing="8" fill="url(#chrome)" stroke="#07183d" stroke-width="5" paint-order="stroke">REELS</text>
<text x="410" y="251" text-anchor="middle" font-family="Arial,sans-serif" font-size="25" font-weight="bold" letter-spacing="8" fill="#ffe16b">PLAY  •  REVIEW  •  WIN</text>
